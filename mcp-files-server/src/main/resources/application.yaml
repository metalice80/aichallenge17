spring:
  application:
    name: mcp-files-server
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: files-server
        version: 1.0.0
        type: SYNC
        stdio: true
logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger - %msg%n"
app:
  files:
    reports-directory: ${REPORTS_DIR:./reports}
    max-content-bytes: ${REPORT_MAX_CONTENT_BYTES:51200}
